[project]
name = "illusory-completion"
version = "2.0.0"
description = "Epistemic Ledger evaluation and the LiveLedger tracker for search agents (arXiv 2602.07549 v2)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx",
    "requests",
    "urllib3",
    "tqdm",
]

[project.optional-dependencies]
baselines = ["torch>=2.4.0", "transformers"]
train = ["torch>=2.4.0", "transformers", "datasets", "accelerate", "ms-swift", "deepspeed"]
